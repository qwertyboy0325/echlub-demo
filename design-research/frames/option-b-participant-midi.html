<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>EchLub Skeleton B — Participant MIDI (1440×900)</title>
  <style>
    * { box-sizing: border-box; margin: 0; font-family: system-ui, sans-serif; }
    body { background: #0d0f14; color: #e8eaef; width: 1440px; height: 900px; overflow: hidden; }
    .top { height: 48px; background: #151922; border-bottom: 1px solid #2a3142; display: flex; align-items: center; padding: 0 16px; gap: 12px; font-size: 13px; }
    .tabs { display: flex; gap: 4px; margin-left: 200px; }
    .tab { padding: 6px 12px; border-radius: 6px; font-size: 12px; color: #8b93a7; }
    .tab.on { background: #1e3a5f; color: #a8d4ff; }
    .body { display: flex; height: calc(900px - 48px); }
    .presence { width: 200px; background: #12161f; border-right: 1px solid #2a3142; }
    .center { flex: 1; display: flex; flex-direction: column; }
    .editor { flex: 1; margin: 8px; background: #141a26; border: 1px solid #2a3142; border-radius: 8px; position: relative; }
    .grid { position: absolute; inset: 40px 16px 16px 48px; background-image: linear-gradient(#2a3142 1px, transparent 1px), linear-gradient(90deg, #2a3142 1px, transparent 1px); background-size: 24px 32px; }
    .note { position: absolute; left: 120px; top: 80px; width: 72px; height: 28px; background: #4a9eff; border-radius: 4px; opacity: .9; }
    .note2 { left: 200px; top: 120px; width: 48px; height: 28px; background: #4a9eff; }
    .inspector { height: 140px; margin: 0 8px 8px; background: #12161f; border-radius: 8px; padding: 12px; font-size: 12px; color: #8b93a7; }
    .exchange { width: 320px; background: #12161f; border-left: 1px solid #2a3142; padding: 12px; }
    .row { background: #1a2030; border-radius: 8px; padding: 10px; margin-bottom: 8px; border-left: 3px solid #2a9d8f; font-size: 12px; }
  </style>
</head>
<body>
  <div class="top">
    <span style="color:#7eb6ff;font-weight:700">EchLub</span>
    <span>Jordan · MIDI workspace</span>
    <div class="tabs">
      <span class="tab">Clip</span><span class="tab on">MIDI</span><span class="tab">Step</span><span class="tab">Devices</span><span class="tab">Arrange</span>
    </div>
  </div>
  <div class="body">
    <aside class="presence"></aside>
    <main class="center">
      <div class="editor"><div class="grid"></div><div class="note"></div><div class="note note2"></div></div>
      <div class="inspector">Queue inspector · pulse-r2 · revision 2 · forked from Alex</div>
    </main>
    <aside class="exchange">
      <div style="font-size:11px;text-transform:uppercase;color:#8b93a7;margin-bottom:12px">Shared Clip Exchange</div>
      <div class="row">pulse-r2 · In Progress · you</div>
    </aside>
  </div>
</body>
</html>
